<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Voice Report Uploader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        body { max-width: 960px; margin: 24px auto; padding: 0 16px; }
        .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
        .row { display: flex; gap:12px; align-items: center; }
        .row > * { flex: 1; }
        .muted { color:#6b7280; font-size: 12px; }
        .btn { appearance:none; border:0; background:#111827; color:white; padding:10px 16px; border-radius:10px; cursor:pointer; }
        .btn[disabled] { opacity:.6; cursor: not-allowed; }
        .bar-wrap { background:#f3f4f6; border-radius:8px; overflow:hidden; height:10px; }
        .bar { height:100%; background:#111827; }
        .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
        .table { width:100%; border-collapse: collapse; }
        .table th, .table td { border-bottom:1px solid #e5e7eb; padding:8px; text-align:left; }
        details { background:#f9fafb; border:1px solid #e5e7eb; padding:8px 12px; border-radius:8px; }
        .ok { color:#059669; }
        .warn { color:#b45309; }
        .err { color:#b91c1c; white-space:pre-wrap; }
        audio { width: 100%; margin-top: 8px; }
        .tag { background:#eef2ff; color:#3730a3; font-size:12px; padding:2px 8px; border-radius:999px; }
    </style>
</head>
<body>
<h1>음성 분석 리포트 업로더</h1>
<p class="muted">WAV 파일을 업로드하면 스프링이 <code>/api/voice-reports</code>로 전송 → Python 분석 → 결과를 아래 카드에 표시합니다.</p>

<div class="card" id="uploader">
    <div class="row">
        <input id="audio" type="file" accept="audio/*" />
        <button id="send" class="btn">업로드 & 분석</button>
    </div>
    <p id="status" class="muted" style="margin-top:8px;"></p>
    <p id="error" class="err"></p>
</div>

<div id="result" style="margin-top:24px; display:none;" class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="title" style="margin:0;">제목 없음</h2>
        <span id="day" class="tag"></span>
    </div>
    <p class="muted" id="meta" style="margin-top:4px;"></p>

    <div class="grid" style="margin-top:16px;">
        <div>
            <h3>요약</h3>
            <p id="summary"></p>
        </div>
        <div>
            <h3>전반 피드백</h3>
            <p id="overall"></p>
        </div>
    </div>

    <div class="grid" style="margin-top:16px;">
        <div>
            <h3>발화 빈도</h3>
            <p class="muted">부모: <span id="pfv">-</span>%</p>
            <div class="bar-wrap"><div id="pfvbar" class="bar" style="width:0%"></div></div>
            <p class="muted" style="margin-top:6px;">아이: <span id="kfv">-</span>%</p>
            <div class="bar-wrap"><div id="kfvbar" class="bar" style="width:0%"></div></div>
            <p id="fvfb" style="margin-top:8px;"></p>
        </div>
        <div>
            <h3>표현/상황</h3>
            <p><b>부모 표현:</b> <span id="pexpr"></span></p>
            <p><b>아이 표현:</b> <span id="kexpr"></span></p>
            <p class="muted"><b>부모 상황:</b> <span id="pcond"></span></p>
            <p class="muted"><b>아이 상황:</b> <span id="kcond"></span></p>
            <p id="exprfb" style="margin-top:8px;"></p>
        </div>
    </div>

    <div class="grid" style="margin-top:16px;">
        <div>
            <h3>감정 타임라인</h3>
            <ul id="timeline" style="margin:0; padding-left:18px;"></ul>
            <p id="emofb" style="margin-top:8px;"></p>
        </div>
        <div>
            <h3>아이 태도</h3>
            <p id="kidAtt"></p>
            <h3 style="margin-top:16px;">패턴 & 강점</h3>
            <p><b>패턴:</b> <span id="pattern"></span></p>
            <p><b>강점:</b> <span id="strength"></span></p>
        </div>
    </div>

    <h3 style="margin-top:16px;">대체 표현 제안</h3>
    <table class="table">
        <thead><tr><th>현재 표현</th><th>제안 표현</th></tr></thead>
        <tbody id="proposals"></tbody>
    </table>

    <details style="margin-top:16px;">
        <summary>오디오 파일</summary>
        <div id="audioWrap"></div>
    </details>
</div>

<script>
    const $ = (id) => document.getElementById(id);
    const apiBase = ''; // 같은 오리진이면 빈 문자열, 프록시/다른 포트면 '/api' 등으로 조정

    const fmtLen = (sec) => {
        if (sec == null) return '-';
        const s = Number(sec)|0;
        const m = String(Math.floor(s/60)).padStart(2,'0');
        const r = String(s%60).padStart(2,'0');
        return `${m}:${r}`;
    };

    $('send').addEventListener('click', async () => {
        $('error').textContent = '';
        $('status').textContent = '';
        const file = $('audio').files[0];
        if (!file) {
            $('error').textContent = '오디오 파일을 선택하세요.';
            return;
        }

        const fd = new FormData();
        fd.append('audio', file, file.name);

        $('send').disabled = true;
        $('status').textContent = '업로드 중…';

        try {
            const res = await fetch(`${apiBase}/api/voice-reports`, {
                method: 'POST',
                body: fd
            });
            const ok = res.ok;
            const data = await res.json().catch(() => null);

            if (!ok) {
                $('error').textContent = '서버 오류: ' + JSON.stringify(data || {});
                $('send').disabled = false;
                $('status').textContent = '';
                return;
            }

            $('status').textContent = '분석 완료!';
            renderReport(data);

        } catch (e) {
            $('error').textContent = '네트워크/예기치 못한 오류: ' + e;
        } finally {
            $('send').disabled = false;
        }
    });

    function renderReport(r) {
        $('result').style.display = 'block';
        $('title').textContent = r.subTitle || '제목 없음';
        $('day').textContent = r.day || '';
        $('meta').textContent = `길이 ${fmtLen(r.length)} · 리포트 ID ${r.id}`;

        $('summary').textContent = r.conversationSummary || '-';
        $('overall').textContent = r.overallFeedback || '-';

        // frequency
        const pfv = r.frequency?.parentFrequency ?? null;
        const kfv = r.frequency?.kidFrequency ?? null;
        $('pfv').textContent = pfv ?? '-';
        $('kfv').textContent = kfv ?? '-';
        $('pfvbar').style.width = (pfv ? Math.max(0, Math.min(100, pfv)) : 0) + '%';
        $('kfvbar').style.width = (kfv ? Math.max(0, Math.min(100, kfv)) : 0) + '%';
        $('fvfb').textContent = r.frequency?.frequencyFeedback || '';

        // expression
        $('pexpr').textContent = r.expression?.parentExpression || '';
        $('kexpr').textContent = r.expression?.kidExpression || '';
        $('pcond').textContent = r.expression?.parentConditions || '';
        $('kcond').textContent = r.expression?.kidConditions || '';
        $('exprfb').textContent = r.expression?.expressionFeedback || '';

        // emotion timeline
        const ul = $('timeline');
        ul.innerHTML = '';
        (r.emotion?.timeline || []).forEach(t => {
            const li = document.createElement('li');
            li.textContent = `${t.time || '--:--'} · ${t.momentEmotion || '-'}`;
            ul.appendChild(li);
        });
        $('emofb').textContent = r.emotion?.emotionFeedback || '';

        $('kidAtt').textContent = r.kidAttitude || '';
        $('pattern').textContent = r.pattern || '';
        $('strength').textContent = r.strength || '';

        // change proposals
        const tbody = $('proposals');
        tbody.innerHTML = '';
        (r.changeProposal || []).forEach(cp => {
            const tr = document.createElement('tr');
            const td1 = document.createElement('td');
            const td2 = document.createElement('td');
            td1.textContent = cp.existingExpression || '';
            td2.textContent = cp.proposalExpression || '';
            tr.appendChild(td1); tr.appendChild(td2);
            tbody.appendChild(tr);
        });

        // audio (download + player)
        const wrap = $('audioWrap');
        wrap.innerHTML = '';
        if (r.id != null) {
            const url = `${apiBase}/api/voice-reports/${r.id}/audio`;
            const a = document.createElement('a');
            a.href = url; a.textContent = '오디오 다운로드';
            a.download = '';
            const player = document.createElement('audio');
            player.controls = true;
            player.src = url;
            wrap.appendChild(a);
            wrap.appendChild(player);
        }
    }
</script>
</body>
</html>
