<!-- src/main/resources/static/chatbot.html -->
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Chatbot Test</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
        .card { max-width: 760px; margin: 0 auto; padding: 16px; border: 1px solid #ddd; border-radius: 12px; }
        textarea { width: 100%; min-height: 120px; }
        input, button, textarea { font-size: 16px; padding: 8px; }
        #answer { white-space: pre-wrap; background:#fafafa; padding:12px; border-radius:8px; border:1px solid #eee; }
        .row { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: center; }
        .row + .row { margin-top: 8px; }
    </style>
</head>
<body>
<div class="card">
    <h2>챗봇 질의 (테스트: userId 고정 = u001)</h2>

    <div class="row">
        <label for="question">질문</label>
        <textarea id="question" placeholder="아이가 친구랑 자주 다투어요. 어떻게 사회성을 길러줄 수 있을까요?"></textarea>
    </div>

    <div style="margin-top:12px">
        <button id="send">질문 보내기</button>
    </div>

    <h3>응답</h3>
    <div id="answer">(여기에 답변이 표시됩니다)</div>
</div>

<script>
    const $ = (s) => document.querySelector(s);
    $('#send').addEventListener('click', async () => {
        const question = $('#question').value.trim();
        if (!question) { alert('질문을 입력하세요'); return; }

        $('#answer').textContent = '요청 중...';
        try {
            const resp = await fetch('/api/chatbot/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // ✅ userId 제거: 질문만 보냄
                body: JSON.stringify({ question })
            });
            if (!resp.ok) {
                const text = await resp.text();
                throw new Error(`[${resp.status}] ${text}`);
            }
            const data = await resp.json();
            $('#answer').textContent = data.answer || JSON.stringify(data, null, 2);
        } catch (e) {
            $('#answer').textContent = '오류: ' + e.message;
        }
    });
</script>
</body>
</html>
