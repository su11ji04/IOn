<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>VoiceReport 업로드/표시 테스트</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
        body { margin: 24px; background:#fafafa; color:#222; }
        h1 { margin: 0 0 16px; }
        .card { background:#fff; border:1px solid #eee; border-radius:16px; padding:16px 20px; box-shadow: 0 4px 16px rgba(0,0,0,.04); margin-bottom:16px; }
        .row { display:flex; gap:12px; flex-wrap: wrap; align-items:center; }
        label { font-weight:600; }
        input[type="text"], input[type="number"] {
            padding:10px 12px; border-radius:10px; border:1px solid #ddd; min-width: 220px;
        }
        input[type="file"] { padding:8px 0; }
        button {
            border:0; background:#111827; color:#fff; padding:10px 14px; border-radius:10px; cursor:pointer;
        }
        button.secondary { background:#2563eb; }
        button.ghost { background:#e5e7eb; color:#111; }
        .muted { color:#666; font-size: .9rem; }
        .grid { display:grid; gap:8px; }
        .kvs { display:grid; grid-template-columns: 140px 1fr; gap:6px 12px; }
        .pill { display:inline-block; padding:3px 8px; border-radius:999px; background:#eef2ff; color:#3730a3; font-weight:600; font-size:.85rem; }
        pre { white-space: pre-wrap; background:#0b1020; color:#e6edf3; padding:12px; border-radius:10px; overflow:auto; }
        table { border-collapse: collapse; width:100%; }
        th, td { border-bottom:1px solid #eee; padding:8px 6px; text-align:left; }
        audio { width:100%; margin-top:8px; }
    </style>
</head>
<body>
<h1>VoiceReport 업로드/표시 테스트</h1>

<!-- 업로드 폼 -->
<div class="card">
    <h2>1) .wav 업로드 → 서버 리포트 표시</h2>
    <div class="grid" style="margin-top:8px;">
        <div class="row">
            <div class="grid">
                <label>소제목 (subTitle) <span class="pill">필수</span></label>
                <input type="text" id="subTitle" placeholder="예: 숙제 대화" />
            </div>
            <div class="grid">
                <label>사용자 ID (선택)</label>
                <input type="number" id="userId" placeholder="예: 42" />
                <span class="muted">미입력 시 null 처리됩니다.</span>
            </div>
        </div>

        <div class="grid">
            <label>.wav 파일 선택</label>
            <input type="file" id="audio" accept=".wav,audio/wav,audio/x-wav" />
            <span class="muted">WAV만 허용. 업로드 시 /api/voice-reports/simple 로 전송합니다.</span>
        </div>

        <div class="row">
            <button id="btnUpload" class="secondary">업로드 & 분석 요청</button>
            <button id="btnClear" class="ghost">화면 지우기</button>
        </div>
        <div id="status" class="muted"></div>
    </div>
</div>

<!-- 임의(Mock) 리포트 표시 -->
<div class="card">
    <h2>2) 임의 리포트 화면 표시 테스트</h2>
    <div class="row">
        <button id="btnMock">모의 리포트 표시</button>
    </div>
</div>

<!-- 결과 영역 -->
<div id="result"></div>

<script>
    const API_BASE = ''; // 같은 서버에서 서빙하면 공백 유지. (예: http://localhost:8080 로 다이렉트 접근 시 CORS 없음)
    const endpointSimple = `${API_BASE}/api/voice-reports/simple`; // audio + subTitle + (optional) userId

    const el = (id) => document.getElementById(id);
    const statusBox = el('status');
    const resultBox = el('result');

    function setStatus(msg) {
        statusBox.textContent = msg || '';
    }

    function fmtSeconds(sec) {
        if (sec == null) return '-';
        const s = Number(sec);
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')} (${s}s)`;
    }

    function renderTimeline(timeline) {
        if (!timeline || !timeline.length) return '<p class="muted">타임라인 없음</p>';
        const rows = timeline.map(t => `
    <tr>
      <td><code>${t.time ?? '-'}</code></td>
      <td>${t.momentEmotion ?? '-'}</td>
    </tr>
  `).join('');
        return `<table>
    <thead><tr><th>시간</th><th>감정</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
    }

    function renderChangeProposals(list) {
        if (!list || !list.length) return '<p class="muted">제안 없음</p>';
        const rows = list.map(c => `
    <tr>
      <td>${c.existingExpression ?? '-'}</td>
      <td><strong>${c.proposalExpression ?? '-'}</strong></td>
    </tr>
  `).join('');
        return `<table>
    <thead><tr><th>현재 표현</th><th>제안 표현</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
    }

    function renderVoiceReport(v) {
        const audioUrl = v?.id != null ? `${API_BASE}/api/voice-reports/${v.id}/audio` : null;
        resultBox.innerHTML = `
    <div class="card">
      <h2>리포트</h2>
      <div class="kvs" style="margin-top:8px;">
        <div>리포트 ID</div><div>${v.id ?? '-'}</div>
        <div>소제목</div><div>${v.subTitle ?? '-'}</div>
        <div>생성일(day)</div><div>${v.day ?? '-'}</div>
        <div>길이</div><div>${fmtSeconds(v.length)}</div>
      </div>

      <h3 style="margin-top:16px;">요약</h3>
      <p>${v.conversationSummary ?? '<span class="muted">-</span>'}</p>

      <h3>전반 피드백</h3>
      <p>${v.overallFeedback ?? '<span class="muted">-</span>'}</p>

      <div class="row" style="margin-top:12px;">
        <div class="card" style="flex:1;">
          <h3>발화 빈도</h3>
          <div class="kvs">
            <div>부모</div><div>${v.frequency?.parentFrequency ?? '-'}%</div>
            <div>아이</div><div>${v.frequency?.kidFrequency ?? '-'}%</div>
          </div>
          <p style="margin-top:8px;">${v.frequency?.frequencyFeedback ?? '<span class="muted">-</span>'}</p>
        </div>
        <div class="card" style="flex:2;">
          <h3>표현 분석</h3>
          <div class="kvs">
            <div>부모 표현</div><div>${v.expression?.parentExpression ?? '-'}</div>
            <div>아이 표현</div><div>${v.expression?.kidExpression ?? '-'}</div>
            <div>부모 조건</div><div>${v.expression?.parentConditions ?? '-'}</div>
            <div>아이 조건</div><div>${v.expression?.kidConditions ?? '-'}</div>
          </div>
          <p style="margin-top:8px;">${v.expression?.expressionFeedback ?? '<span class="muted">-</span>'}</p>
        </div>
      </div>

      <div class="card" style="margin-top:12px;">
        <h3>감정 타임라인</h3>
        ${renderTimeline(v.emotion?.timeline)}
        <p style="margin-top:8px;">${v.emotion?.emotionFeedback ?? '<span class="muted">-</span>'}</p>
      </div>

      <div class="card" style="margin-top:12px;">
        <h3>아이 태도</h3>
        <p>${v.kidAttitude ?? '<span class="muted">-</span>'}</p>
      </div>

      <div class="card" style="margin-top:12px;">
        <h3>표현 변경 제안</h3>
        ${renderChangeProposals(v.changeProposal)}
      </div>

      <div class="row" style="margin-top:12px;">
        <div class="card" style="flex:1;">
          <h3>패턴</h3>
          <p>${v.pattern ?? '<span class="muted">-</span>'}</p>
        </div>
        <div class="card" style="flex:1;">
          <h3>강점</h3>
          <p>${v.strength ?? '<span class="muted">-</span>'}</p>
        </div>
      </div>

      ${audioUrl ? `
        <div class="card" style="margin-top:12px;">
          <h3>오디오</h3>
          <audio controls src="${audioUrl}"></audio>
          <div style="margin-top:8px;">
            <a href="${audioUrl}" download>오디오 다운로드</a>
          </div>
        </div>
      ` : ''}

      <h3 style="margin-top:16px;">원본 JSON</h3>
      <pre>${escapeHtml(JSON.stringify(v, null, 2))}</pre>
    </div>
  `;
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, s => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[s]));
    }

    async function uploadAndAnalyze() {
        setStatus('');
        resultBox.innerHTML = '';

        const subTitle = el('subTitle').value.trim();
        const userIdVal = el('userId').value.trim();
        const file = el('audio').files[0];

        if (!subTitle) {
            alert('소제목(subTitle)은 필수입니다.');
            return;
        }
        if (!file) {
            alert('WAV 파일을 선택해주세요.');
            return;
        }
        const fname = (file.name || '').toLowerCase();
        if (!fname.endsWith('.wav')) {
            alert('WAV 파일만 업로드할 수 있습니다.');
            return;
        }

        const fd = new FormData();
        fd.append('audio', file, file.name);
        fd.append('subTitle', subTitle);
        if (userIdVal) fd.append('userId', userIdVal);

        try {
            setStatus('업로드 중...');
            const res = await fetch(endpointSimple, { method: 'POST', body: fd });
            if (!res.ok) {
                const text = await res.text().catch(()=> '');
                throw new Error(`서버 오류 (${res.status}) ${text}`);
            }
            const data = await res.json();
            setStatus('완료!');
            renderVoiceReport(data);
        } catch (err) {
            console.error(err);
            setStatus('오류: ' + err.message);
            resultBox.innerHTML = '';
        }
    }

    function showMock() {
        const mock = {
            id: 999,
            subTitle: "숙제 대화",
            day: "2025-08-27",
            conversationSummary: "오늘 숙제를 시작하는 과정에서 갈등이 있었고, 부모의 지시형 표현에 아이가 방어적으로 반응했습니다.",
            length: 123,
            overallFeedback: "경청과 공감 시도를 늘리고, 지시형 표현을 구체-긍정 제안으로 바꾸면 효과가 큽니다.",
            frequency: { parentFrequency: 62, kidFrequency: 38, frequencyFeedback: "부모 발화 비율이 높습니다. 질문형 유도로 아이 발화를 늘려보세요." },
            expression: {
                parentExpression: "지시형, 간헐적 칭찬",
                kidExpression: "단답, 회피",
                parentConditions: "과제 직전 통제적 지시 증가",
                kidConditions: "피곤할 때 반항적 언어",
                expressionFeedback: "지시를 구체-긍정 프레이밍으로 바꾸면 효과적입니다."
            },
            emotion: {
                timeline: [
                    { time: "00:12", momentEmotion: "Neutral" },
                    { time: "00:47", momentEmotion: "Frustration" },
                    { time: "01:15", momentEmotion: "Relief" }
                ],
                emotionFeedback: "감정 고조 구간(00:40~00:55)에 휴지/공감 문장을 삽입하세요."
            },
            kidAttitude: "과제 회피 경향, 단기 보상에 반응",
            changeProposal: [
                { existingExpression: "왜 아직도 안 했어?", proposalExpression: "지금 뭐부터 시작하면 좋을까? 내가 도와줄 부분 있을까?" },
                { existingExpression: "빨리 해!", proposalExpression: "5분 타이머 맞추고 시작해보자. 끝나면 간식 먹자." }
            ],
            pattern: "지시→반항→갈등→타협",
            strength: "마무리 칭찬 일관성, 규칙 준수 시 보상 제안"
        };
        renderVoiceReport(mock);
    }

    el('btnUpload').addEventListener('click', uploadAndAnalyze);
    el('btnClear').addEventListener('click', () => { setStatus(''); resultBox.innerHTML=''; });
    el('btnMock').addEventListener('click', showMock);
</script>
</body>
</html>
